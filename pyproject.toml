[project]
name = "nekro-plugin-denia-novelai"
version = "2.0.3"
description = "NovelAI generation with shared daily quotas, whitelists, FIFO scheduling and gallery outbox."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pillow>=10", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
